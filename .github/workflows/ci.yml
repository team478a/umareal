name: Validate foundation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: keiba
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: keiba_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U keiba -d keiba_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://keiba:ci-only-password@127.0.0.1:55432/keiba_test
      AUTH_PROVIDER: local
      LAUNCH_MODE: FULL
      APP_BASE_URL: http://localhost:3000
      API_BASE_URL: http://127.0.0.1:4000
      API_PORT: 4000
      # Integration tests exercise the authentication and administration APIs
      # intensively from one loopback address. Keep production defaults intact.
      AUTH_RATE_LIMIT: 1000
      LOCAL_RATE_LIMIT_MULTIPLIER: 10
      NOTIFICATION_TRANSPORT: test
      LINE_OAUTH_TRANSPORT: test
      BILLING_TRANSPORT: test
      MAIL_TRANSPORT: test
      CAPTCHA_TRANSPORT: test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test encryption key
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'ENCRYPTION_KEY=' + require('crypto').randomBytes(32).toString('base64') + '\n')"
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply migrations to fresh CI database
        run: pnpm db:migrate
      - name: Build shared domain and database packages
        run: pnpm --filter @keiba/domain build && pnpm --filter @keiba/db build
      - name: Typecheck all workspaces
        run: pnpm typecheck
      - name: Lint repository
        run: pnpm lint
      - name: Unit tests and deployment preflight tests
        run: pnpm test
      - name: JRA-VAN bridge unit tests
        run: python -m unittest discover -s tools/jra_van_bridge/tests -t . -v
      - name: Build all workspaces
        run: pnpm build
      - name: Build production container image
        run: docker build --tag umareal:ci .
      - name: Verify unsafe production modes fail closed
        run: node scripts/check-production-guard.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start test services
        run: |
          mkdir -p .local
          (cd apps/api && exec node dist/main.js) > .local/api.log 2>&1 &
          echo $! > .local/api.pid
          pnpm --filter @keiba/web start > .local/web.log 2>&1 &
          node scripts/wait-services.mjs
      - name: Database and API integration tests with local transports
        run: pnpm test:integration
      - name: Restart API in local Stripe webhook mode
        env:
          BILLING_TRANSPORT: stripe
          STRIPE_LIVE_MODE: 'false'
          STRIPE_SECRET_KEY: sk_test_ci_local_signature_only
          STRIPE_WEBHOOK_SECRET: whsec_ci_local_signature_only
          STRIPE_PRICE_FOUNDER: price_ci_founder
          STRIPE_PRICE_STANDARD: price_ci_standard
          STRIPE_PRICE_DAY_PASS: price_ci_day_pass
        run: |
          api_test_pid="$(cat .local/api.pid)"
          kill "$api_test_pid"
          for attempt in $(seq 1 50); do
            if ! kill -0 "$api_test_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          (cd apps/api && exec node dist/main.js) > .local/api-stripe-local.log 2>&1 &
          echo $! > .local/api.pid
          node scripts/wait-services.mjs
      - name: Stripe webhook integration tests without external Stripe calls
        env:
          BILLING_TRANSPORT: stripe
          STRIPE_LIVE_MODE: 'false'
          STRIPE_SECRET_KEY: sk_test_ci_local_signature_only
          STRIPE_WEBHOOK_SECRET: whsec_ci_local_signature_only
          STRIPE_PRICE_FOUNDER: price_ci_founder
          STRIPE_PRICE_STANDARD: price_ci_standard
          STRIPE_PRICE_DAY_PASS: price_ci_day_pass
        run: pnpm test:integration:stripe-local
      - name: Restart API in local test transport mode for browser tests
        run: |
          api_test_pid="$(cat .local/api.pid)"
          kill "$api_test_pid"
          for attempt in $(seq 1 50); do
            if ! kill -0 "$api_test_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          (cd apps/api && exec node dist/main.js) > .local/api-e2e.log 2>&1 &
          node scripts/wait-services.mjs
      - name: Browser E2E on desktop and mobile viewports
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: playwright-report/
