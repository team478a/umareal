services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keiba
      POSTGRES_USER: keiba
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - keiba_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keiba -d keiba"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  keiba_data:
